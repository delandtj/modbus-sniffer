[package]
name = "sniffer-stm32f411"
version = "0.1.0"
edition = "2021"

[features]
# Default build: sniff real RS-485 traffic on USART2.
default = []
# Self-test build: no UART; inject canned Modbus frames into the USB path
# so the analyzer output can be verified without a live bus.
# Mutually exclusive with the real sniffer at compile time.
selftest = []

[dependencies]

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"

heapless = "0.8.0"
static_cell = "2.0.0"
modbus-sniffer-core = { version = "0.1.0", path = "../core" }
embassy-stm32 = { version = "0.6.0", features = ["stm32f411ce", "time-driver-any", "exti", "memory-x"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
