[package]
name = "modbus-sniffer-tools"
version = "0.1.0"
edition = "2021"
description = "Host-side capture daemon and protocol-map analyzer for the Modbus RTU sniffer"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
humantime = "2.4.0"
modbus-sniffer-core = { version = "0.1.0", path = "../core" }
socket2 = "0.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
