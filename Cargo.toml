[workspace]
resolver = "2"
members = ["core", "fw-stm32f411", "fw-esp32c6", "tools"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# The esp-idf bootloader / espflash image tooling and esp-backtrace both want
# DWARF in the ELF (the ELF is never flashed as-is, only the extracted image),
# so keeping full debug info costs nothing in flash.
debug = 2
