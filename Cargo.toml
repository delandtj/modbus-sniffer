[package]
name = "stm32-modbus-sniffer"
version = "0.1.0"
edition = "2021"

[features]
# Default build: sniff real RS-485 traffic on USART2.
default = []
# Self-test build: no UART; inject canned Modbus frames into the USB path
# so the analyzer output can be verified without a live bus.
# Mutually exclusive with the real sniffer at compile time.
selftest = []

[dependencies]

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"

heapless = "0.8.0"
static_cell = "2.0.0"
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", version = "0.6.0", features = ["stm32f411ce", "time-driver-any", "exti", "memory-x"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", version = "0.5.1" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", version = "0.6.0" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", version = "0.1.2" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", version = "0.8.0" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
